name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch APKEditor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          gh release download V1.4.9 --repo REAndroid/APKEditor --pattern '*.jar' --dir app/libs
          ls -l app/libs
      - name: Make signing key
        run: |
          mkdir -p app/src/main/assets
          keytool -genkeypair -keystore app/src/main/assets/sign.p12 -storetype PKCS12 \
            -storepass android -alias sign -keyalg RSA -keysize 2048 \
            -validity 36500 -dname "CN=ApkMerger"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ApkMerger
          path: app/build/outputs/apk/debug/app-debug.apk
